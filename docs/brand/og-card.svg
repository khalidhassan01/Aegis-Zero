<?xml version="1.0" encoding="UTF-8"?>
<!-- Aegis Zero — social preview card (og:image / Twitter summary_large_image).

     1200x630: the standard Open Graph canvas. Zero fronts the card; the
     wordmark, promise lines, and feature chips echo docs/aegis-hero.svg.
     Rendered to og-card.png by scripts/make_brand.py (pinned by tests).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04110f"/>
      <stop offset="55%" stop-color="#020806"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="field" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#0d3f36"/>
      <stop offset="55%" stop-color="#062420"/>
      <stop offset="100%" stop-color="#020e0c"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33ffe3"/>
      <stop offset="48%" stop-color="#00e0b8"/>
      <stop offset="100%" stop-color="#00bd96"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#0c3b34" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="aura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Zero (full avatar mark), left -->
  <g transform="translate(8,49) scale(0.875)">
    <circle cx="256" cy="256" r="248" fill="url(#field)"/>
    <circle cx="256" cy="26" r="10" fill="#ffd700" opacity="0.9"/>
    <circle cx="57" cy="371" r="10" fill="#ffd700" opacity="0.9"/>
    <circle cx="455" cy="371" r="10" fill="#ffd700" opacity="0.9"/>
    <g filter="url(#aura)">
      <path d="M 116 236
               A 140 140 0 0 1 396 236
               C 396 300 372 352 328 388
               C 306 404 282 414 256 420
               C 230 414 206 404 184 388
               C 140 352 116 300 116 236 Z"
            fill="url(#body)" stroke="#00ffcc" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <path d="M 174 154 A 116 116 0 0 1 256 120" fill="none" stroke="#ffffff"
          stroke-opacity="0.28" stroke-width="11" stroke-linecap="round"/>
    <circle cx="256" cy="238" r="84" fill="none" stroke="#053b33" stroke-opacity="0.92" stroke-width="17"/>
    <circle cx="224" cy="252" r="24" fill="#04241f"/>
    <circle cx="288" cy="252" r="24" fill="#04241f"/>
    <circle cx="217" cy="244" r="9" fill="#ffffff"/>
    <circle cx="281" cy="244" r="9" fill="#ffffff"/>
    <circle cx="232" cy="262" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="296" cy="262" r="4" fill="#ffffff" opacity="0.85"/>
    <path d="M 240 286 Q 256 300 272 286" fill="none" stroke="#04241f"
          stroke-width="7" stroke-linecap="round"/>
    <g filter="url(#sparkle)">
      <path d="M 404 88 Q 408 104 424 110 Q 408 116 404 132 Q 400 116 384 110 Q 400 104 404 88 Z" fill="#ffd700"/>
    </g>
    <circle cx="256" cy="420" r="6.5" fill="#ffd700"/>
  </g>

  <!-- wordmark + promise (right), echoing aegis-hero.svg -->
  <text x="600" y="250" font-size="86" font-weight="900" fill="#ffffff" letter-spacing="13">AEGIS</text>
  <line x1="602" y1="272" x2="846" y2="272" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.55"/>
  <text x="604" y="304" font-family="'Courier New', monospace" font-size="21" fill="#00ffcc" letter-spacing="11">Z E R O</text>
  <text x="604" y="372" font-family="'Courier New', monospace" font-size="19" fill="#cbd5e1">A state-of-the-art agentic runtime.</text>
  <text x="604" y="402" font-family="'Courier New', monospace" font-size="19" fill="#cbd5e1">Policy-governed tools. Memory that learns.</text>
  <text x="604" y="432" font-family="'Courier New', monospace" font-size="19" fill="#cbd5e1">Verification before trust.</text>

  <!-- feature chips -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#94a3b8">
    <rect x="604" y="478" width="142" height="32" rx="6" fill="#00ffcc" fill-opacity="0.06" stroke="#00ffcc" stroke-opacity="0.4"/>
    <text x="623" y="499">async runtime</text>
    <rect x="758" y="478" width="172" height="32" rx="6" fill="#ffd700" fill-opacity="0.06" stroke="#ffd700" stroke-opacity="0.4"/>
    <text x="777" y="499">grounded verifier</text>
    <rect x="942" y="478" width="204" height="32" rx="6" fill="#00ffcc" fill-opacity="0.06" stroke="#00ffcc" stroke-opacity="0.4"/>
    <text x="961" y="499">fail-fast degradation</text>
  </g>
</svg>
