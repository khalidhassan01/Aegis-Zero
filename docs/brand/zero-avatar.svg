<?xml version="1.0" encoding="UTF-8"?>
<!-- Aegis Zero — Main Logo Mark
     Rotating-ring shield design with orbiting elements.
     Brand palette: #00ffcc teal · #ffd700 gold · #000000 deep black
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Shield fill gradient -->
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Shield stroke gradient -->
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="60%" stop-color="#00ffcc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Cyan glow filter -->
    <filter id="cg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gold glow filter -->
    <filter id="gg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip path for shield grid -->
    <clipPath id="sc">
      <path d="M256 40 L336 68 L336 170 C336 230 256 280 256 280 C256 280 176 230 176 170 L176 68 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="8 4"/>

  <!-- Tick marks - outer ring -->
  <g stroke="#00ffcc" stroke-opacity="0.4" stroke-width="1">
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(0,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(30,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(60,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(90,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(120,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(150,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(180,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(210,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(240,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(270,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(300,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="70" transform="rotate(330,256,256)"/>
  </g>

  <!-- Major tick marks -->
  <g stroke="#00ffcc" stroke-width="2" stroke-opacity="0.9" filter="url(#cg)">
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(0,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(90,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(180,256,256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(270,256,256)"/>
  </g>

  <!-- Middle gold ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 20"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#00ffcc" stroke-width="0.6" stroke-opacity="0.15"/>

  <!-- Orbiting cyan dot -->
  <circle cx="256" cy="56" r="5" fill="#00ffcc" filter="url(#cg)" transform="rotate(45,256,256)"/>

  <!-- Orbiting gold dot -->
  <circle cx="256" cy="56" r="4" fill="#ffd700" filter="url(#gg)" transform="rotate(225,256,256)"/>

  <!-- Shield -->
  <g>
    <path d="M256 40 L336 68 L336 170 C336 230 256 280 256 280 C256 280 176 230 176 170 L176 68 Z" fill="url(#shieldFill)"/>

    <!-- Grid lines inside shield -->
    <g clip-path="url(#sc)" stroke="#00ffcc" stroke-width="0.5" stroke-opacity="0.18">
      <line x1="176" y1="100" x2="336" y2="100"/>
      <line x1="176" y1="130" x2="336" y2="130"/>
      <line x1="176" y1="160" x2="336" y2="160"/>
      <line x1="176" y1="190" x2="336" y2="190"/>
      <line x1="176" y1="220" x2="336" y2="220"/>
      <line x1="196" y1="40" x2="196" y2="280"/>
      <line x1="216" y1="40" x2="216" y2="280"/>
      <line x1="236" y1="40" x2="236" y2="280"/>
      <line x1="256" y1="40" x2="256" y2="280"/>
      <line x1="276" y1="40" x2="276" y2="280"/>
      <line x1="296" y1="40" x2="296" y2="280"/>
      <line x1="316" y1="40" x2="316" y2="280"/>
    </g>

    <!-- Shield outer stroke -->
    <path d="M256 40 L336 68 L336 170 C336 230 256 280 256 280 C256 280 176 230 176 170 L176 68 Z" fill="none" stroke="url(#shieldStroke)" stroke-width="2.5" filter="url(#cg)"/>

    <!-- Shield inner stroke -->
    <path d="M256 52 L324 76 L324 170 C324 222 256 268 256 268 C256 268 188 222 188 170 L188 76 Z" fill="none" stroke="#00ffcc" stroke-width="0.6" stroke-opacity="0.3"/>

    <!-- Gold accent bar at top of shield -->
    <line x1="200" y1="76" x2="312" y2="76" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.8" filter="url(#gg)"/>

    <!-- Corner marks - top left -->
    <line x1="176" y1="90" x2="192" y2="90" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="176" y1="68" x2="176" y2="94" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Corner marks - top right -->
    <line x1="320" y1="90" x2="336" y2="90" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="336" y1="68" x2="336" y2="94" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Bottom gold tip -->
    <circle cx="256" cy="278" r="4" fill="#ffd700" filter="url(#gg)"/>
    <line x1="256" y1="268" x2="256" y2="275" stroke="#ffd700" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Center zero digit -->
    <text x="256" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="100" font-weight="900" fill="none" stroke="#00ffcc" stroke-width="2.5" filter="url(#cg)" opacity="0.95">0</text>
  </g>

  <!-- AEGIS text -->
  <text x="256" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="16">AEGIS</text>

  <!-- Divider line -->
  <line x1="150" y1="352" x2="362" y2="352" stroke="#00ffcc" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- ZERO text -->
  <text x="256" y="372" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#00ffcc" letter-spacing="10" opacity="0.9">Z E R O</text>
</svg>
