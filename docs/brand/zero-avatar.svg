<?xml version="1.0" encoding="UTF-8"?>
<!-- Zero — the Aegis Zero mark. Master avatar.

     The still form of the interactive hero logo
     (docs/assets/aegis-zero-logo-interactive.svg): one mark, three movements.
       * an orbit  — the dashed verdict ring, the gold counter-ring, and the
         two sentinel dots the hero sets spinning: verification never sleeps
       * a shield  — the aegis: glass over a measurement grid, because
         nothing executes unreviewed
       * a zero    — the glowing ring at the shield's heart is the digit 0:
         zero trust, zero swallowed failures

     Brand palette: #00ffcc teal · #ffd700 gold · #000000 deep black.
     Text-free by design: it must read at favicon size and in any language.
     Strokes run slightly bolder than the hero's so the mark survives
     favicon size. Renders are pinned by tests/test_brand.py — regenerate
     via scripts/make_brand.py, never edit the PNGs by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="60%" stop-color="#00ffcc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.1"/>
    </linearGradient>
    <clipPath id="sc">
      <path d="M 256 82 L 386.5 122.6 L 386.5 270.5 C 386.5 357.5 256 430 256 430 C 256 430 125.5 357.5 125.5 270.5 L 125.5 122.6 Z"/>
    </clipPath>
    <filter id="cg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- deep field; a full circle so the mark survives any round crop -->
  <circle cx="256" cy="256" r="248" fill="url(#field)"/>

  <!-- the verdict ring: dashed, ticked, and turning in the hero -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ffcc" stroke-width="3.5" stroke-opacity="0.7" stroke-dasharray="12 6"/>
  <g stroke="#00ffcc" stroke-opacity="0.4" stroke-width="2">
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(0,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(30,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(60,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(90,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(120,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(150,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(180,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(210,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(240,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(270,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(300,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="32" transform="rotate(330,256,256)"/>
  </g>
  <g stroke="#00ffcc" stroke-width="5" stroke-opacity="0.9" filter="url(#cg)">
    <line x1="256" y1="46" x2="256" y2="26" transform="rotate(0,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="26" transform="rotate(90,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="26" transform="rotate(180,256,256)"/>
    <line x1="256" y1="46" x2="256" y2="26" transform="rotate(270,256,256)"/>
  </g>

  <!-- the scrutiny ring: gold, running the other way -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffd700" stroke-width="1.2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffd700" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="5 30"/>

  <!-- the static inner ring -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.15"/>

  <!-- the sentinels: the hero's orbiting dots, caught mid-flight -->
  <circle cx="404.5" cy="107.5" r="8" fill="#00ffcc" filter="url(#cg)"/>
  <circle cx="107.5" cy="404.5" r="6" fill="#ffd700" filter="url(#gg)"/>

  <!-- the shield: the aegis, glass over a measurement grid -->
  <path id="shield" d="M 256 82 L 386.5 122.6 L 386.5 270.5 C 386.5 357.5 256 430 256 430 C 256 430 125.5 357.5 125.5 270.5 L 125.5 122.6 Z" fill="url(#shieldFill)"/>
  <g clip-path="url(#sc)" stroke="#00ffcc" stroke-width="0.8" stroke-opacity="0.18">
    <line x1="125.5" y1="169" x2="386.5" y2="169"/>
    <line x1="125.5" y1="212.5" x2="386.5" y2="212.5"/>
    <line x1="125.5" y1="256" x2="386.5" y2="256"/>
    <line x1="125.5" y1="299.5" x2="386.5" y2="299.5"/>
    <line x1="125.5" y1="343" x2="386.5" y2="343"/>
    <line x1="169" y1="82" x2="169" y2="430"/>
    <line x1="212.5" y1="82" x2="212.5" y2="430"/>
    <line x1="256" y1="82" x2="256" y2="430"/>
    <line x1="299.5" y1="82" x2="299.5" y2="430"/>
    <line x1="343" y1="82" x2="343" y2="430"/>
  </g>
  <path d="M 256 82 L 386.5 122.6 L 386.5 270.5 C 386.5 357.5 256 430 256 430 C 256 430 125.5 357.5 125.5 270.5 L 125.5 122.6 Z" fill="none" stroke="url(#shieldStroke)" stroke-width="4" filter="url(#cg)"/>
  <path d="M 256 99.4 L 369.1 134.2 L 369.1 270.5 C 369.1 345.9 256 412.6 256 412.6 C 256 412.6 142.9 345.9 142.9 270.5 L 142.9 134.2 Z" fill="none" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="169" y1="122.6" x2="343" y2="122.6" stroke="#ffd700" stroke-width="2.2" stroke-opacity="0.8"/>
  <g stroke="#00ffcc" stroke-width="2.2" stroke-opacity="0.8">
    <path d="M 125.5 154.5 L 148.7 154.5"/>
    <path d="M 125.5 122.6 L 125.5 160.3"/>
    <path d="M 363.3 154.5 L 386.5 154.5"/>
    <path d="M 386.5 122.6 L 386.5 160.3"/>
  </g>

  <!-- the zero: a glowing ring at the shield's heart -->
  <ellipse cx="256" cy="252" rx="40" ry="48" fill="none" stroke="#00ffcc" stroke-width="8" opacity="0.95" filter="url(#cg)"/>

  <!-- the verified tip: gold, earned only by verification -->
  <line x1="256" y1="412.6" x2="256" y2="422.7" stroke="#ffd700" stroke-width="2.2" stroke-opacity="0.8"/>
  <circle cx="256" cy="427.1" r="5.8" fill="#ffd700" filter="url(#gg)"/>
</svg>
