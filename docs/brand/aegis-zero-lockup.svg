<?xml version="1.0" encoding="UTF-8"?>
<!-- Aegis Zero — horizontal lockup: Zero beside the wordmark.

     For README side-bars, talk slides, and anywhere the mark and name must
     travel together. Dark plate so it presents on light and dark surfaces.
     Rendered to aegis-zero-lockup.png by scripts/make_brand.py (pinned by tests).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360"
     font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="field" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#0d3f36"/>
      <stop offset="55%" stop-color="#062420"/>
      <stop offset="100%" stop-color="#020e0c"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33ffe3"/>
      <stop offset="48%" stop-color="#00e0b8"/>
      <stop offset="100%" stop-color="#00bd96"/>
    </linearGradient>
    <filter id="aura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="780" height="360" rx="28" fill="#020e0c"/>
  <rect x="0.5" y="0.5" width="779" height="359" rx="27.5"
        fill="none" stroke="#00ffcc" stroke-opacity="0.14"/>

  <!-- Zero, left -->
  <g transform="translate(21,22) scale(0.62)">
    <circle cx="256" cy="256" r="248" fill="url(#field)"/>
    <circle cx="256" cy="26" r="10" fill="#ffd700" opacity="0.9"/>
    <circle cx="57" cy="371" r="10" fill="#ffd700" opacity="0.9"/>
    <circle cx="455" cy="371" r="10" fill="#ffd700" opacity="0.9"/>
    <g filter="url(#aura)">
      <path d="M 116 236
               A 140 140 0 0 1 396 236
               C 396 300 372 352 328 388
               C 306 404 282 414 256 420
               C 230 414 206 404 184 388
               C 140 352 116 300 116 236 Z"
            fill="url(#body)" stroke="#00ffcc" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <path d="M 174 154 A 116 116 0 0 1 256 120" fill="none" stroke="#ffffff"
          stroke-opacity="0.28" stroke-width="11" stroke-linecap="round"/>
    <circle cx="256" cy="238" r="84" fill="none" stroke="#053b33" stroke-opacity="0.92" stroke-width="17"/>
    <circle cx="224" cy="252" r="24" fill="#04241f"/>
    <circle cx="288" cy="252" r="24" fill="#04241f"/>
    <circle cx="217" cy="244" r="9" fill="#ffffff"/>
    <circle cx="281" cy="244" r="9" fill="#ffffff"/>
    <circle cx="232" cy="262" r="4" fill="#ffffff" opacity="0.85"/>
    <circle cx="296" cy="262" r="4" fill="#ffffff" opacity="0.85"/>
    <path d="M 240 286 Q 256 300 272 286" fill="none" stroke="#04241f"
          stroke-width="7" stroke-linecap="round"/>
    <g filter="url(#sparkle)">
      <path d="M 404 88 Q 408 104 424 110 Q 408 116 404 132 Q 400 116 384 110 Q 400 104 404 88 Z" fill="#ffd700"/>
    </g>
    <circle cx="256" cy="420" r="6.5" fill="#ffd700"/>
  </g>

  <!-- wordmark, right -->
  <text x="430" y="196" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="13">AEGIS</text>
  <line x1="432" y1="220" x2="706" y2="220" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.55"/>
  <text x="434" y="252" font-family="'Courier New', monospace" font-size="21" fill="#00ffcc" letter-spacing="11">Z E R O</text>
</svg>
