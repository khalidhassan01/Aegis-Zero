<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04110f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#0c3b34" stroke-width="0.5" opacity="0.45"/>
    </pattern>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5eead4"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ffd700"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      .box   { rx:9; }
      .t     { fill:#e6fffb; font-size:14px; font-weight:700; }
      .s     { fill:#7dd3c0; font-size:10px; }
      .edge  { fill:#5eead4; font-size:10px; }
      .gold  { fill:#ffd700; }
      .teal  { fill:#00ffcc; }
      .rose  { fill:#fb7185; }
      .mut   { fill:#8aa39c; font-size:10px; }
    </style>
  </defs>

  <rect width="1240" height="760" fill="url(#bg)"/>
  <rect width="1240" height="760" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#ffffff">AEGIS ZERO — RUNTIME TOPOLOGY</text>
  <text x="42" y="68" font-size="11" class="mut">goal in  →  plan  →  execute  →  synthesize  →  verify  →  learn</text>
  <line x1="40" y1="82" x2="1200" y2="82" stroke="#00ffcc" stroke-opacity="0.3"/>

  <!-- Provider resilience band (top right) -->
  <g>
    <rect x="900" y="100" width="300" height="92" rx="10" fill="#00ffcc" fill-opacity="0.05" stroke="#00ffcc" stroke-opacity="0.5" stroke-dasharray="6 4"/>
    <text x="916" y="120" font-size="11" class="teal">PROVIDER RESILIENCE (ResilientProvider)</text>
    <rect x="916" y="132" width="120" height="44" rx="7" fill="#022c25" stroke="#00ffcc" stroke-opacity="0.6"/>
    <text x="976" y="152" text-anchor="middle" class="t">primary</text>
    <text x="976" y="168" text-anchor="middle" class="s">7b · retry</text>
    <rect x="1056" y="132" width="132" height="44" rx="7" fill="#2a1f02" stroke="#ffd700" stroke-opacity="0.6"/>
    <text x="1122" y="152" text-anchor="middle" class="gold" font-size="14" font-weight="700">fallback</text>
    <text x="1122" y="168" text-anchor="middle" class="s" fill="#e8c84a">3b → 1.5b</text>
    <text x="1050" y="124" font-size="9" class="mut">fail-fast after 1 attempt</text>
  </g>

  <!-- Goal -->
  <rect x="40" y="120" width="150" height="64" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.6"/>
  <text x="115" y="148" text-anchor="middle" class="t">Goal</text>
  <text x="115" y="166" text-anchor="middle" class="s">user intent</text>

  <!-- Planner -->
  <rect x="240" y="120" width="160" height="64" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.6"/>
  <text x="320" y="146" text-anchor="middle" class="t">Planner</text>
  <text x="320" y="162" text-anchor="middle" class="s">decompose</text>
  <text x="320" y="176" text-anchor="middle" class="s">normalize ids</text>

  <!-- Scout -->
  <rect x="240" y="220" width="160" height="56" rx="9" fill="#062b27" stroke="#00ffcc" stroke-opacity="0.7"/>
  <text x="320" y="244" text-anchor="middle" class="t">Scout</text>
  <text x="320" y="262" text-anchor="middle" class="s">recon (complex)</text>

  <!-- Forge waves -->
  <rect x="460" y="180" width="520" height="120" rx="12" fill="#00ffcc" fill-opacity="0.03" stroke="#5eead4" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text x="476" y="200" font-size="11" class="teal">FORGE — bounded tool loops, parallel dependency waves</text>
  <rect x="476" y="212" width="150" height="64" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.4"/>
  <text x="551" y="238" text-anchor="middle" class="t">Forge A</text>
  <text x="551" y="254" text-anchor="middle" class="s">tool loop</text>
  <rect x="652" y="212" width="150" height="64" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.4"/>
  <text x="727" y="238" text-anchor="middle" class="t">Forge B</text>
  <text x="727" y="254" text-anchor="middle" class="s">tool loop</text>
  <rect x="828" y="212" width="136" height="64" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.4"/>
  <text x="896" y="238" text-anchor="middle" class="t">Forge C</text>
  <text x="896" y="254" text-anchor="middle" class="s">tool loop</text>
  <text x="476" y="294" font-size="9" class="mut">each call → PolicyEngine → allow / sanitize / approve / deny</text>

  <!-- Policy boundary around tools -->
  <rect x="1010" y="170" width="190" height="150" rx="12" fill="#fb7185" fill-opacity="0.05" stroke="#fb7185" stroke-opacity="0.55" stroke-dasharray="6 4"/>
  <text x="1026" y="190" font-size="11" class="rose">POLICY ENGINE</text>
  <rect x="1026" y="200" width="158" height="40" rx="7" fill="#2a0813" stroke="#fb7185" stroke-opacity="0.7"/>
  <text x="1105" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#fecdd3">Tool Registry</text>
  <rect x="1026" y="248" width="158" height="34" rx="7" fill="#2a0813" stroke="#fb7185" stroke-opacity="0.5"/>
  <text x="1105" y="269" text-anchor="middle" font-size="10" fill="#fecdd3">SSRF · secret redaction</text>
  <rect x="1026" y="288" width="158" height="24" rx="7" fill="#2a0813" stroke="#fb7185" stroke-opacity="0.4"/>
  <text x="1105" y="304" text-anchor="middle" font-size="9" fill="#fecdd3">human approval gate</text>

  <!-- Synthesizer -->
  <rect x="460" y="350" width="180" height="60" rx="9" fill="#022c25" stroke="#00ffcc" stroke-width="1.4"/>
  <text x="550" y="376" text-anchor="middle" class="t">Synthesizer</text>
  <text x="550" y="392" text-anchor="middle" class="s">merge · resolve</text>

  <!-- Auditor + Verifier -->
  <rect x="700" y="350" width="190" height="60" rx="9" fill="#2a1f02" stroke="#ffd700" stroke-width="1.6"/>
  <text x="795" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#ffd700">Auditor + Verifier</text>
  <text x="795" y="390" text-anchor="middle" class="s" fill="#e8c84a">grounded checks</text>

  <!-- MemRL -->
  <rect x="460" y="470" width="200" height="64" rx="9" fill="#062b27" stroke="#5eead4" stroke-opacity="0.7"/>
  <text x="560" y="496" text-anchor="middle" class="t">MemRL Engine</text>
  <text x="560" y="512" text-anchor="middle" class="s">reward · decay</text>
  <text x="560" y="526" text-anchor="middle" class="s">temporal · explore</text>

  <!-- Continual Harness -->
  <rect x="700" y="470" width="240" height="64" rx="9" fill="#062b27" stroke="#5eead4" stroke-opacity="0.6"/>
  <text x="820" y="496" text-anchor="middle" class="t">Continual Harness</text>
  <text x="820" y="512" text-anchor="middle" class="s">grounded lessons</text>
  <text x="820" y="526" text-anchor="middle" class="s">rollback · scope</text>

  <!-- Memory store (bottom) -->
  <rect x="120" y="470" width="200" height="64" rx="9" fill="#062b27" stroke="#5eead4" stroke-opacity="0.6"/>
  <text x="220" y="496" text-anchor="middle" class="t">Vector Store</text>
  <text x="220" y="512" text-anchor="middle" class="s">memory · qdrant</text>
  <text x="220" y="526" text-anchor="middle" class="s">budget-aware recall</text>

  <!-- Event bus footer -->
  <rect x="40" y="600" width="1160" height="40" rx="9" fill="#00ffcc" fill-opacity="0.03" stroke="#00ffcc" stroke-opacity="0.3"/>
  <text x="56" y="625" font-size="11" class="teal">EVENT BUS · OBSERVABILITY</text>
  <text x="360" y="625" font-size="10" class="mut">typed events → logging · metrics · JSONL trace · pass^k reliability</text>

  <!-- EDGES -->
  <line x1="190" y1="152" x2="238" y2="152" stroke="#5eead4" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="400" y1="152" x2="460" y2="240" stroke="#5eead4" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="320" y1="184" x2="320" y2="218" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="400" y1="240" x2="458" y2="240" stroke="#5eead4" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="980" y1="240" x2="1008" y2="240" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="640" y1="300" x2="550" y2="348" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="640" y1="380" x2="698" y2="380" stroke="#5eead4" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="890" y1="380" x2="910" y2="380" stroke="#ffd700" stroke-width="1.4" marker-end="url(#arG)"/>
  <path d="M795 410 L795 440 Q795 455 770 455 L660 455 Q560 455 560 466 L560 468" fill="none" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="560" y1="410" x2="560" y2="468" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="660" y1="502" x2="700" y2="502" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="320" y1="502" x2="280" y2="502" stroke="#5eead4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="660" y1="502" x2="900" y2="500" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="700" y="500" font-size="9" class="gold">reward</text>

  <!-- legend -->
  <g font-size="9" class="mut">
    <rect x="40" y="676" width="14" height="10" rx="2" fill="#022c25" stroke="#00ffcc"/>
    <text x="60" y="685">core</text>
    <rect x="120" y="676" width="14" height="10" rx="2" fill="#2a1f02" stroke="#ffd700"/>
    <text x="140" y="685">verification</text>
    <rect x="226" y="676" width="14" height="10" rx="2" fill="#2a0813" stroke="#fb7185"/>
    <text x="246" y="685">policy / security</text>
  </g>
</svg>
