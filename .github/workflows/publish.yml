# Publish aegis-zero to PyPI with tokenless OIDC trusted publishing.
#
# One-time setup (Khalid): on pypi.org/manage/account/publishing/ add a
# "pending" trusted publisher for this project (or create the project via
# the pending publisher the first time):
#   PyPI project name : aegis-zero
#   Owner             : khalidhassan01
#   Repository        : Aegis-Zero
#   Workflow filename : publish.yml
#   Environment name   : pypi
#
# Also create a GitHub environment named `pypi` (Settings → Environments) and
# require approval there if you want a final human gate before release.
#
# This workflow never holds a PyPI token: PyPI mints a short-lived OIDC token
# for exactly this job. It runs only when a GitHub Release is published (or
# manually dispatched), so the decision to ship stays with the maintainer.
#
# Toolchain note: this build job deliberately uses the same setup-python +
# pip + `python -m build` shape as ci.yml — the empirically green workflow
# on this repo's runners. (A uv-based variant failed every run at job setup.)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build toolchain
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Trusted publishing (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required to mint the PyPI OIDC token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
