name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
        continue-on-error: true
      - name: Mypy
        run: mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv pip install --system -e ".[dev,qdrant]"
      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage floor
        run: coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - run: uv pip install --system dist/*.whl
      - name: Smoke-test the installed CLI
        run: |
          aegis --version
          AEGIS_PROVIDER__KIND=echo aegis tools
          AEGIS_PROVIDER__KIND=echo aegis run "hello" --approve deny --no-memory --json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
