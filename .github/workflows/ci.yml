name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install (uv)
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/python -m ruff check src tests

      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check src tests

      - name: Mypy
        run: .venv/bin/python -m mypy

      # Supply-chain visibility: fail-open so a transitive advisory never
      # blocks unrelated work; dependabot opens version bumps for fixes.
      - name: pip-audit (advisory scan, non-blocking)
        continue-on-error: true
        run: |
          uv pip install pip-audit
          .venv/bin/pip-audit --skip-editable

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install (uv)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,qdrant]"

      - name: Show environment
        run: |
          .venv/bin/python --version
          .venv/bin/python -c "import aegis_zero; print('aegis_zero', aegis_zero.__version__)"

      - name: Run tests
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage floor
        run: .venv/bin/python -m coverage report --fail-under=80

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Build wheel and sdist (uv)
        run: uv build

      - name: Install the built wheel into a clean venv
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl

      - name: Smoke-test the installed CLI
        env:
          AEGIS_PROVIDER__KIND: echo
        run: |
          /tmp/smoke/bin/aegis --version
          /tmp/smoke/bin/aegis tools
          /tmp/smoke/bin/aegis run "hello" --approve deny --no-memory --json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
