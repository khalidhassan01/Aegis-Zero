name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep uv quiet and reproducible in CI.
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Create virtualenv and install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Create virtualenv and install
        run: |
          uv venv
          uv pip install -e ".[dev,qdrant]"

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage floor
        run: uv run coverage report --fail-under=80

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Build wheel and sdist
        run: uv build

      - name: Install the built wheel into a clean venv
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl

      - name: Smoke-test the installed CLI
        env:
          AEGIS_PROVIDER__KIND: echo
        run: |
          /tmp/smoke/bin/aegis --version
          /tmp/smoke/bin/aegis tools
          /tmp/smoke/bin/aegis run "hello" --approve deny --no-memory --json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
