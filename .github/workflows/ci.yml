name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy
        run: python -m mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,qdrant]"

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          python -c "import aegis_zero; print('aegis_zero', aegis_zero.__version__)"

      - name: Run tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage floor
        run: python -m coverage report --fail-under=80

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl

      - name: Smoke-test the installed CLI
        env:
          AEGIS_PROVIDER__KIND: echo
        run: |
          /tmp/smoke/bin/aegis --version
          /tmp/smoke/bin/aegis tools
          /tmp/smoke/bin/aegis run "hello" --approve deny --no-memory --json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
