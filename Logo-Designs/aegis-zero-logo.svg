<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a2a25"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Shield stroke gradient -->
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00e0b8"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.3"/>
    </linearGradient>
    
    <!-- Shield fill gradient -->
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.03"/>
    </linearGradient>
    
    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <!-- Shield clip path -->
    <clipPath id="shieldClip">
      <path d="M300 30 L395 58 L395 160 C395 225 300 275 300 275 C300 275 205 225 205 160 L205 58 Z"/>
    </clipPath>
    
    <!-- Animations -->
    <style>
      @keyframes spin1 { from{transform-origin:300px 155px;transform:rotate(0deg)} to{transform-origin:300px 155px;transform:rotate(360deg)} }
      @keyframes spin2 { from{transform-origin:300px 155px;transform:rotate(0deg)} to{transform-origin:300px 155px;transform:rotate(-360deg)} }
      @keyframes pulse { 0%,100%{opacity:0.85} 50%{opacity:1} }
      @keyframes sparkle { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
      .outerRing{animation:spin1 25s linear infinite}
      .middleRing{animation:spin2 15s linear infinite}
      .particle1{animation:spin1 10s linear infinite}
      .particle2{animation:spin2 10s linear infinite}
      .shieldPulse{animation:pulse 4s ease-in-out infinite}
      .sparkle{animation:sparkle 2s ease-in-out infinite}
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGlow)"/>
  
  <!-- Outer decorative ring -->
  <g class="outerRing">
    <circle cx="300" cy="155" r="150" fill="none" stroke="#00ffcc" stroke-width="0.5" stroke-opacity="0.1"/>
    <circle cx="300" cy="155" r="150" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="12 6"/>
    
    <!-- Tick marks -->
    <g stroke="#00ffcc" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(0,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(45,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(90,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(135,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(180,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(225,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(270,300,155)"/>
      <line x1="300" y1="5" x2="300" y2="18" transform="rotate(315,300,155)"/>
    </g>
    
    <!-- Subtle secondary ring -->
    <circle cx="300" cy="155" r="160" fill="none" stroke="#00ffcc" stroke-width="0.3" stroke-opacity="0.15" stroke-dasharray="4 8"/>
  </g>
  
  <!-- Middle gold ring -->
  <g class="middleRing">
    <circle cx="300" cy="155" r="115" fill="none" stroke="#ffd700" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 20"/>
    <circle cx="300" cy="155" r="108" fill="none" stroke="#ffd700" stroke-width="0.4" stroke-opacity="0.15"/>
  </g>
  
  <!-- Inner ring -->
  <circle cx="300" cy="155" r="80" fill="none" stroke="#00ffcc" stroke-width="0.5" stroke-opacity="0.12"/>
  
  <!-- Orbiting particles -->
  <g class="particle1"><circle cx="300" cy="5" r="5" fill="#00ffcc" filter="url(#glow)" opacity="0.9" transform="rotate(60,300,155)"/></g>
  <g class="particle2"><circle cx="300" cy="5" r="4" fill="#ffd700" filter="url(#softGlow)" opacity="0.85" transform="rotate(240,300,155)"/></g>
  <g class="particle1"><circle cx="300" cy="5" r="3" fill="#00ffcc" filter="url(#softGlow)" opacity="0.6" transform="rotate(180,300,155)"/></g>
  
  <!-- Shield with pulse animation -->
  <g class="shieldPulse">
    <!-- Shield background -->
    <path d="M300 30 L395 58 L395 160 C395 225 300 275 300 275 C300 275 205 225 205 160 L205 58 Z" fill="url(#shieldFill)"/>
    
    <!-- Shield grid pattern -->
    <g clip-path="url(#shieldClip)" stroke="#00ffcc" stroke-width="0.4" stroke-opacity="0.15">
      <line x1="205" y1="85" x2="395" y2="85"/>
      <line x1="205" y1="125" x2="395" y2="125"/>
      <line x1="205" y1="165" x2="395" y2="165"/>
      <line x1="205" y1="205" x2="395" y2="205"/>
      <line x1="230" y1="30" x2="230" y2="275"/>
      <line x1="265" y1="30" x2="265" y2="275"/>
      <line x1="300" y1="30" x2="300" y2="275"/>
      <line x1="335" y1="30" x2="335" y2="275"/>
      <line x1="370" y1="30" x2="370" y2="275"/>
    </g>
    
    <!-- Shield outline with glow -->
    <path d="M300 30 L395 58 L395 160 C395 225 300 275 300 275 C300 275 205 225 205 160 L205 58 Z" 
          fill="none" stroke="url(#shieldStroke)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Inner shield line -->
    <path d="M300 45 L383 70 L383 160 C383 215 300 262 300 262 C300 262 217 215 217 160 L217 70 Z" 
          fill="none" stroke="#00ffcc" stroke-width="0.6" stroke-opacity="0.25"/>
    
    <!-- Gold accent bar -->
    <line x1="225" y1="58" x2="375" y2="58" stroke="url(#goldGrad)" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>
    
    <!-- Corner accents -->
    <path d="M205 75 L222 75" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round"/>
    <path d="M205 58 L205 82" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round"/>
    <path d="M378 75 L395 75" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round"/>
    <path d="M395 58 L395 82" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round"/>
    
    <!-- Gold tip dot with sparkle -->
    <g class="sparkle">
      <circle cx="300" cy="273" r="5" fill="#ffd700" filter="url(#softGlow)"/>
      <line x1="300" y1="262" x2="300" y2="270" stroke="#ffd700" stroke-width="2" stroke-opacity="0.8"/>
    </g>
    
    <!-- Center ZERO with glow effect -->
    <text x="300" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="95" font-weight="900" 
          fill="none" stroke="#00ffcc" stroke-width="3" filter="url(#textGlow)" opacity="0.95">0</text>
  </g>
  
  <!-- AEGIS wordmark -->
  <text x="300" y="325" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="900" 
        fill="#ffffff" style="letter-spacing:18px">AEGIS</text>
  
  <!-- Divider line -->
  <line x1="160" y1="335" x2="440" y2="335" stroke="#00ffcc" stroke-width="0.8" stroke-opacity="0.4"/>
  
  <!-- ZERO subtext -->
  <text x="300" y="352" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" 
        fill="#00ffcc" style="letter-spacing:12px" opacity="0.85">Z E R O</text>
</svg>
