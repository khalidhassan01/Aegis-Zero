[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-zero"
version = "2.0.0"
description = "A state-of-the-art agentic runtime: async orchestration, policy-governed tools, and reinforcement-weighted memory."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Khalid Hassan" }]
keywords = ["agent", "llm", "orchestration", "memory", "tools", "agentic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = ["aegis-zero[qdrant,dev]"]

[project.scripts]
aegis = "aegis_zero.cli:main"

[project.urls]
Homepage = "https://github.com/khalidhassan01/Aegis-Zero"
Issues = "https://github.com/khalidhassan01/Aegis-Zero/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/aegis_zero"]
branch = true

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
  "A003",      # dataclass fields may shadow builtins
  "B008",      # function calls in defaults are used deliberately
  "RUF012",    # mutable class attrs are dataclass fields
  "N818",      # error names read better without a forced Error suffix
  "UP042",     # str+Enum is intentional: values serialise directly to JSON
  "ASYNC240",  # pathlib calls are already wrapped in asyncio.to_thread
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/aegis_zero"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
